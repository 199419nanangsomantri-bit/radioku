name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Buat scaffold Android jika belum ada
        run: |
          if [ ! -d android ]; then
            mkdir -p /tmp/backup
            cp pubspec.yaml /tmp/backup/pubspec.yaml
            cp -r lib /tmp/backup/lib
            flutter create --platforms=android --org com.radiosaya --project-name radio_saya .
            cp /tmp/backup/pubspec.yaml pubspec.yaml
            rm -rf lib
            cp -r /tmp/backup/lib lib
          fi

      - name: Pasang AndroidManifest
        run: cp android_override/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - name: Install dependensi
        run: flutter pub get

      - name: Build APK release
        run: flutter build apk --release

      - name: Kumpulkan APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/radio-saya.apk

      - name: Signing APK (opsional)
        if: env.KEYSTORE_BASE64 != ''
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          "$BT/zipalign" -f -p 4 dist/radio-saya.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASSWORD \
            --out dist/radio-saya-signed.apk \
            "$RUNNER_TEMP/aligned.apk"
          rm dist/radio-saya.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: radio-apk
          path: dist/*.apk
